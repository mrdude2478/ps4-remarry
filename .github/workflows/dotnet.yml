name: Build PS4 Remarry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore PS4Remarry.sln

    - name: Build
      run: dotnet build PS4Remarry.sln --configuration Release --no-restore

    - name: Publish
      run: |
        dotnet publish src/PS4Remarry.WinForms/PS4Remarry.WinForms.csproj `
          --configuration Release `
          --output publish `
          --self-contained false

    - name: Note about missing tools
      run: |
        Write-Host "##[warning] The tools folder is not included in this artifact."
        Write-Host "##[warning] Users must supply their own copy of PS4-Fake-PKG-Tools-3.87."
        Write-Host "##[warning] Place the files in a 'tools' folder next to PS4Remarry.exe."

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PS4Remarry-Executable
        path: publish/
