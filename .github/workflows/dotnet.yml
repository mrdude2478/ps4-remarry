name: Build PS4 Remarry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore PS4Remarry.sln

    - name: Build
      run: dotnet build PS4Remarry.sln --configuration Release --no-restore

    - name: Publish (Create the Executable)
      run: |
        dotnet publish src/PS4Remarry.WinForms/PS4Remarry.WinForms.csproj `
          --configuration Release `
          --output publish `
          --self-contained false

    - name: Copy tools folder to publish directory
      run: |
        if (Test-Path "tools") {
          Copy-Item -Path "tools" -Destination "publish/tools" -Recurse -Force
          Write-Host "Copied tools folder to publish directory"
        } else {
          Write-Host "Warning: tools folder not found in repository root"
        }

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PS4Remarry-Executable
        path: publish/
